<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Over the Hill Field Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: field-guide sidebar on the left, the game's own topo map filling the rest; on phones the sidebar slides over the map. */
:root{
  --bg:#eef1ec; --panel:#f8faf6; --fg:#1c2722; --muted:#5d6b63; --line:#d5ddd6; --hover:#e6ece6;
  --accent:#c9551f; --accent-fg:#fff; --done:#2c9157; --done-soft:#dcefe2; --map-bg:#d9d6c7;
  --shadow:0 6px 24px rgba(20,30,25,.18);
  --f-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:340px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#18201c; --fg:#e3eae5; --muted:#93a39a; --line:#2b3731; --hover:#212b26;
  --accent:#f07a42; --accent-fg:#1a0f08; --done:#4cc27f; --done-soft:#1d3a29; --map-bg:#2a2b26;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#18201c; --fg:#e3eae5; --muted:#93a39a; --line:#2b3731; --hover:#212b26;
  --accent:#f07a42; --accent-fg:#1a0f08; --done:#4cc27f; --done-soft:#1d3a29; --map-bg:#2a2b26;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
.app{display:flex;height:100%}
/* ---------- sidebar ---------- */
.side{width:var(--side);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.side-head{padding-block:18px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.close-side{display:none;border:0;background:none;font-size:22px;line-height:1;padding:4px 8px;cursor:pointer;color:var(--muted)}
.regions{display:flex;gap:6px}
.region{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.region span{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.region[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.region:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backup{display:grid;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.backup textarea{width:100%;height:64px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:11px/1.4 ui-monospace,monospace;padding:6px}
.backup .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--hover);padding:4px;border-radius:10px}
.tab{border:0;background:none;padding:7px 4px 6px;border-radius:7px;cursor:pointer;display:grid;gap:1px;text-align:center}
.tab b{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.tab span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab:focus-visible,.row-main:focus-visible,.eye:focus-visible,.item:focus-visible,.btn:focus-visible,.mk:focus-visible,.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.progress{display:grid;gap:6px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.progress-top em{font-style:normal;font-family:var(--f-display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.progress-top span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:5px;transition:width .3s}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font:inherit;color:var(--fg)}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.switch{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(12px)}
.side-body{overflow-y:auto;flex:1;min-height:0;padding-block:6px 16px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:8px}
.group-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.group-label button{border:0;background:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:none;color:var(--accent);cursor:pointer;padding:2px 4px}
.row{border-radius:8px}
.row-line{display:flex;align-items:center;gap:4px}
.eye{flex:none;width:34px;height:34px;border:0;border-radius:8px;background:none;cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--hover)}
.chip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.chip img{width:15px;height:15px}
.dot{width:12px;height:12px;border-radius:50%}
.row.off .chip,.row.off .dot{opacity:.25;filter:grayscale(1)}
.row.off .row-main{color:var(--muted)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer}
.row-main:hover{background:var(--hover)}
.row-main .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main .cnt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.row-main .cnt.full{color:var(--done);font-weight:800}
.caret{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
.row.open .caret{transform:rotate(45deg)}
.seen{flex:none;width:30px;height:30px;border:0;background:none;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.seen:hover{background:var(--hover)}
.seen:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.items{display:none;padding:2px 0 8px 38px}
.row.open .items{display:grid;gap:1px}
.item{display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.item:hover{background:var(--hover)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .gr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--done)}
.cbx{width:17px;height:17px;flex:none;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;background:var(--panel)}
.done>.cbx,.cbx.on{background:var(--done);border-color:var(--done)}
.cbx svg{width:11px;height:11px;opacity:0}
.done>.cbx svg,.cbx.on svg{opacity:1}
.diff{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:9px;background:var(--hover);color:var(--muted)}
.diff.hard{color:#b03a2e}.diff.medium{color:#a8741a}.diff.easy{color:var(--done)}
.side-foot{border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.save{display:flex;align-items:center;gap:6px;min-width:0}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.save.cloud::before{background:var(--done)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.danger{color:#b03a2e;border-color:#e3b7b0}
.confirm{display:flex;gap:6px;align-items:center}
/* ---------- map ---------- */
.mapwrap{flex:1;position:relative;min-width:0;background:var(--map-bg);overflow:hidden;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;width:2048px;height:2048px;transform-origin:0 0;will-change:transform}
.stage img.map{position:absolute;inset:0;width:2048px;height:2048px;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.grid-lbl{position:absolute;font-family:var(--f-display);font-weight:500;font-size:28px;color:rgba(40,45,40,.55);transform:translate(-50%,-50%) scale(var(--inv));pointer-events:none}
.mk{position:absolute;width:0;height:0;border:0;padding:0;background:none;cursor:pointer}
.mk>span{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--inv));display:block;transform-origin:center}
.mk .b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2.5px #fff,0 2px 6px rgba(0,0,0,.45);transition:filter .15s}
.mk .b img{width:19px;height:19px;pointer-events:none}
.mk.sm .b{width:20px;height:20px;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.4)}
.mk.sm .b img{width:13px;height:13px}
.mk.an .b{width:15px;height:15px;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.45)}
.mk:hover .b{filter:brightness(1.15)}
.mk.sel .b{box-shadow:0 0 0 3px var(--accent),0 0 0 6px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.5)}
.mk.done .b{filter:saturate(.35) brightness(1.05)}
.mk .ck{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:var(--done);box-shadow:0 0 0 2px #fff;display:none;place-items:center}
.mk .ck svg{width:10px;height:10px}
.mk.done .ck{display:grid}
.mk.an .ck{right:-9px;top:-9px;width:13px;height:13px}
.mk.an .ck svg{width:8px;height:8px}
.zoom{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{background:var(--hover)}
.open-side{display:none;position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:5;border:1px solid var(--line);background:var(--panel);border-radius:9px;box-shadow:var(--shadow);padding:8px 12px;font-weight:800;cursor:pointer;gap:8px;align-items:center}
.coords{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);z-index:4;pointer-events:none}
/* ---------- popup ---------- */
.pop{position:absolute;z-index:10;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;cursor:default}
.pop-h{display:flex;gap:10px;align-items:center}
.pop-h .chip{width:34px;height:34px;flex:none}
.pop-h .chip img{width:21px;height:21px}
.pop-h .t{min-width:0;flex:1}
.pop-h .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pop-h .n{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.15;text-wrap:balance}
.pop-x{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;align-self:flex-start;padding:0 2px;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
.collect{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.collect.on{background:var(--done-soft);color:var(--done)}
.collect .cbx{border-color:currentColor;background:transparent}
.collect.on .cbx{background:var(--done);border-color:var(--done)}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:12px;text-align:left}
.note{font-size:12px;color:var(--muted);line-height:1.4}
@media (max-width:760px){
  .side{position:fixed;left:0;top:0;bottom:0;width:min(92vw,360px);transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .app.side-open .side{transform:none}
  .close-side,.open-side{display:flex}
  .coords{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Map filters and progress">
    <div class="side-head">
      <div class="brand">
        <div><small id="regionSub">Over the Hill · Canada</small><h1 id="regionName">The Valhallas</h1></div>
        <button class="close-side" id="closeSide" aria-label="Close panel">×</button>
      </div>
      <div class="regions" id="regions" aria-label="Region"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="progress">
        <div class="progress-top"><span id="progLbl">Collectibles</span><em id="progNum">0 / 0</em></div>
        <div class="bar"><i id="progBar" style="width:0"></i></div>
      </div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Search this map" aria-label="Search markers">
        <label class="switch"><input type="checkbox" id="hideDone"><i></i>Hide collected</label>
      </div>
    </div>
    <div class="side-body" id="cats"></div>
    <div class="backup" id="backup" hidden>
      <span>Copy this code to move your progress to another copy of the tracker, or paste a code here and restore it.</span>
      <textarea id="backupText" aria-label="Progress code" spellcheck="false"></textarea>
      <div class="row2"><button class="btn" id="bkCopy">Copy code</button><button class="btn" id="bkRestore">Restore from code</button><span id="bkMsg"></span></div>
    </div>
    <div class="side-foot">
      <span class="save" id="saveState">Saved in this browser</span>
      <span style="display:flex;gap:6px"><button class="btn" id="bkToggle">Backup</button><span id="resetWrap"><button class="btn danger" id="resetBtn">Reset map</button></span></span>
    </div>
  </aside>
  <main class="mapwrap" id="map" aria-label="Map">
    <div class="stage" id="stage"><img class="map" id="mapImg" alt="" draggable="false"><div id="layer"></div></div>
    <button class="open-side" id="openSide">☰ Filters</button>
    <div class="coords" id="coords">Grid —</div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit map" style="font-size:14px">⤢</button></div>
  </main>
</div>

/* ---------- progress storage: your account when available, else this browser ---------- */
const store = { mode:"local", ref:null, file:false, saving:false, dirty:false, timer:null, first:true };
const SAVE_LABEL = { cloud:"Saved to your account", file:"Saved to progress.json", local:"Saved in this browser", fileerr:"Can't reach progress.json, saved in this browser" };
function setSaveLabel(){ const el=document.getElementById("saveState"); el.className="save"+(store.mode==="cloud"||store.mode==="file"?" cloud":""); el.textContent = SAVE_LABEL[store.mode]; }
/* local copy: tracker_server.py serves the page and reads/writes progress.json through /api/progress */
async function initFileStore(){
  if (!/^https?:$/.test(location.protocol) || !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return false;
  try{
    const r = await fetch("api/progress", {cache:"no-store"});
    if (!r.ok) return false;
    const body = await r.json();
    const fromFile = normalize((body.ids||[]).filter(validKey));
    const union = new Set([...fromFile, ...state.collected]);
    store.file = true; store.mode = "file"; setSaveLabel();
    state.collected = union; LS.set("collected",[...union]); renderAll();
    if (union.size !== (body.ids||[]).length) queueSave();
    return true;
  }catch(e){ return false; }
}
async function initStore(){
  try{
    if (await initFileStore()) return;
    if(!window.claude?.use) return;
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    store.ref = db.doc("data/users/"+uid+"/progress");
    store.ref.onSnapshot(snap=>{
      if (snap.metadata.hasPendingWrites || store.timer || store.saving) return;
      const rawRemote = snap.exists ? (snap.data().ids||[]) : [];
      const remote = normalize(rawRemote);
      if (store.first){
        store.first=false; store.mode="cloud"; setSaveLabel();
        const union = new Set([...remote, ...state.collected]);
        state.collected = union; LS.set("collected",[...union]); renderAll();
        if (union.size !== rawRemote.length || remote.size !== rawRemote.length) queueSave();
        return;
      }
      state.collected = remote; LS.set("collected",[...remote]); renderAll();
    }, ()=>{ store.ref=null; store.mode="local"; setSaveLabel(); });
  }catch(e){ store.ref=null; }
}
function queueSave(){
  LS.set("collected",[...state.collected]);
  if(!store.ref && !store.file) return;
  clearTimeout(store.timer);
  store.timer = setTimeout(flush, 600);
}
async function flush(){
  store.timer=null;
  if(store.saving){ store.dirty=true; return; }
  store.saving=true;
  if (store.file){
    try{
      const r = await fetch("api/progress", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({v:1, ids:[...state.collected]})});
      store.mode = r.ok ? "file" : "fileerr";
    }catch(e){ store.mode = "fileerr"; }
    setSaveLabel(); store.saving=false;
    if(store.dirty){ store.dirty=false; flush(); }
    return;
  }
  try{ await store.ref.set({ids:[...state.collected]}); }
  catch(e){ if(e && e.code==="invalid_argument"){ store.ref=null; store.mode="local"; setSaveLabel(); } }
  store.saving=false;
  if(store.dirty){ store.dirty=false; flush(); }
}
function toggleCollected(id, on){
  const has = state.collected.has(id);
  if (on===undefined) on=!has;
  if (on===has) return;
  on ? state.collected.add(id) : state.collected.delete(id);
  queueSave(); renderAll();
}

const mapEl = document.getElementById("map"), stage = document.getElementById("stage"), layer = document.getElementById("layer"), img = document.getElementById("mapImg");
const view = { s:.4, x:0, y:0 };
const MIN=.15, MAX=4;
function apply(){
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  stage.style.setProperty("--inv", (1/Math.max(view.s,.45)*Math.min(1,Math.max(.75,view.s))).toFixed(4));
  placePop();
}
function fit(){
  const r = mapEl.getBoundingClientRect();
  const pad = r.width<500 ? 34 : 64; view.s = Math.min((r.width-pad)/2048, (r.height-pad)/2048);
  view.x = (r.width-2048*view.s)/2+6; view.y=(r.height-2048*view.s)/2+8; apply();
}
function zoomAt(f, cx, cy){
  const ns = Math.min(MAX, Math.max(MIN, view.s*f)); f = ns/view.s;
  view.x = cx-(cx-view.x)*f; view.y = cy-(cy-view.y)*f; view.s=ns; apply();
}
function flyTo(m){
  const r = mapEl.getBoundingClientRect();
  if (view.s<1) view.s = 1.1;
  view.x = r.width/2 - m.x*view.s; view.y = r.height/2 - m.y*view.s; apply();
}
mapEl.addEventListener("wheel", e=>{ e.preventDefault(); const r=mapEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
const ptrs = new Map(); let drag=null, moved=false, pinch=null;
mapEl.addEventListener("pointerdown", e=>{
  if (e.target.closest(".pop,.zoom,.open-side")) return;
  mapEl.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===1){ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; moved=false; }
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s}; drag=null; moved=true; }
});
mapEl.addEventListener("pointermove", e=>{
  const r=mapEl.getBoundingClientRect();
  const mx=(e.clientX-r.left-view.x)/view.s, my=(e.clientY-r.top-view.y)/view.s;
  if (mx>=0&&my>=0&&mx<2048&&my<2048) document.getElementById("coords").textContent = `Grid ${"ABCDEFGH"[Math.floor(mx/256)]}${Math.floor(my/256)+1} · x ${Math.round(mx/2048*4000-2000)}  z ${Math.round(2000-my/2048*4000)}`;
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((pinch.s*d/pinch.d)/view.s, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top); return;
  }
  if (drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (!moved && Math.hypot(dx,dy)>5){ moved=true; mapEl.classList.add("drag"); }
    if (moved){ view.x=drag.vx+dx; view.y=drag.vy+dy; apply(); }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch=null;
  if (ptrs.size===0){
    mapEl.classList.remove("drag");
    if (drag && !moved){
      const el = document.elementFromPoint(e.clientX,e.clientY);
      const mk = el && el.closest(".mk");
      if (mk) select(mk.dataset.id); else if (!el?.closest(".pop")) select(null);
    }
    drag=null;
  }
}
mapEl.addEventListener("pointerup", endPtr); mapEl.addEventListener("pointercancel", endPtr);
mapEl.addEventListener("dblclick", e=>{ if(e.target.closest(".pop,.zoom")) return; const r=mapEl.getBoundingClientRect(); zoomAt(1.8, e.clientX-r.left, e.clientY-r.top); });
document.getElementById("zin").onclick=()=>{const r=mapEl.getBoundingClientRect();zoomAt(1.5,r.width/2,r.height/2)};
document.getElementById("zout").onclick=()=>{const r=mapEl.getBoundingClientRect();zoomAt(1/1.5,r.width/2,r.height/2)};
document.getElementById("zfit").onclick=fit;
addEventListener("resize", ()=>apply());

/* ---------- markers ---------- */
function catOf(m){ return m.c==="animal" ? {one:"Animal spawn",color:SPC[m.s]} : CAT[m.c]; }
function visible(m){
  if (keyOff(m)) return false;
  if (state.hideDone && isDone(m) && m.id!==state.sel) return false;
  if (state.q){ const q=state.q.toLowerCase(); if (!(m.n.toLowerCase().includes(q) || catOf(m).one.toLowerCase().includes(q) || (m.g||"").toLowerCase()===q)) return false; }
  return true;
}
let mkEls = {};
function buildMarkers(){
  layer.innerHTML=""; mkEls={};
  const grid = document.createDocumentFragment();
  for (let i=0;i<8;i++){ const t=document.createElement("div"); t.className="grid-lbl"; t.style.left=(i*256+128)+"px"; t.style.top="-26px"; t.textContent="ABCDEFGH"[i]; grid.appendChild(t); }
  for (let i=0;i<8;i++){ const t=document.createElement("div"); t.className="grid-lbl"; t.style.left="-26px"; t.style.top=(i*256+128)+"px"; t.textContent=i+1; grid.appendChild(t); }
  layer.appendChild(grid);
  const list = [...MARKERS[state.area]].sort((a,b)=>(a.c==="animal")-(b.c==="animal")||(a.c==="meteor")-(b.c==="meteor")||a.y-b.y);
  list.reverse();
  for (const m of list){
    const b = document.createElement("button");
    b.className = "mk" + (m.c==="animal"?" an": CAT[m.c]?.sm?" sm":"");
    b.dataset.id = m.id; b.style.left=m.x+"px"; b.style.top=m.y+"px";
    b.setAttribute("aria-label", `${catOf(m).one}: ${m.n}, grid ${m.g}`);
    const c = catOf(m);
    b.innerHTML = `<span><span class="b" style="background:${c.color}">${m.c!=="animal"?`<img src="${ICONS[m.c]}" alt="">`:""}</span><span class="ck">${CHECK}</span></span>`;
    b.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(m.id); } });
    layer.appendChild(b); mkEls[m.id]=b;
  }
}
function paintMarkers(){
  for (const m of MARKERS[state.area]){
    const el = mkEls[m.id]; if(!el) continue;
    el.hidden = !visible(m);
    el.classList.toggle("done", isDone(m));
    el.classList.toggle("sel", state.sel===m.id);
  }
}

/* ---------- popup ---------- */
let popEl=null;
function select(id){
  state.sel = id;
  if (popEl){ popEl.remove(); popEl=null; }
  if (id){
    const m = byId[id], c = catOf(m), on = isDone(m), an = m.c==="animal";
    popEl = document.createElement("div"); popEl.className="pop"; popEl.setAttribute("role","dialog");
    const pair = m.to ? byId[m.to] : m.for ? byId[m.for] : null;
    popEl.innerHTML = `
      <div class="pop-h"><span class="chip" style="background:${c.color}">${m.c!=="animal"?`<img src="${ICONS[m.c]}" alt="">`:""}</span>
        <div class="t"><div class="k">${c.one}</div><div class="n"></div></div><button class="pop-x" aria-label="Close">×</button></div>
      <dl class="facts"><dt>Grid</dt><dd>${m.g}</dd><dt>Position</dt><dd>x ${m.wx} · z ${m.wz}</dd><dt>Altitude</dt><dd>${m.h} m</dd>${m.d?`<dt>Difficulty</dt><dd><span class="diff ${m.d}">${m.d}</span></dd>`:""}</dl>
      ${pair?`<button class="link" data-go="${pair.id}">${m.to?"Show where to deliver it →":"Show the item to pick up →"}</button>`:""}
      ${an?`<div class="note">Animals roam around their spawner, so look in the surrounding area. Seeing one ${m.s} anywhere in ${AREAS.find(a=>a.id===m.a).name} ticks off every spawn point for it.</div>`:""}
      <button class="collect${on?" on":""}"><span class="cbx${on?" on":""}">${CHECK}</span>${an?(on?`${m.s} seen`:`Mark ${m.s} as seen`):(on?"Collected":"Mark as collected")}</button>`;
    popEl.querySelector(".n").textContent = m.n;
    popEl.querySelector(".pop-x").onclick = ()=>select(null);
    popEl.querySelector(".collect").onclick = ()=>toggleCollected(colKey(m));
    const go = popEl.querySelector("[data-go]"); if (go) go.onclick=()=>{ flyTo(pair); select(pair.id); };
    popEl.addEventListener("pointerdown", e=>e.stopPropagation());
    mapEl.appendChild(popEl); placePop();
  }
  paintMarkers();
}
function placePop(){
  if(!popEl||!state.sel) return;
  const m=byId[state.sel], r=mapEl.getBoundingClientRect();
  const sx=view.x+m.x*view.s, sy=view.y+m.y*view.s;
  const w=popEl.offsetWidth, h=popEl.offsetHeight;
  let left = sx+22, top = sy-h/2;
  if (left+w > r.width-10) left = sx-22-w;
  left = Math.max(10, Math.min(left, r.width-w-10));
  top = Math.max(10, Math.min(top, r.height-h-10));
  popEl.style.left=left+"px"; popEl.style.top=top+"px";
}

/* ---------- sidebar ---------- */
function trackables(a){ return MARKERS[a].filter(m=>CAT[m.c]?.track); }
function renderTabs(){
  const cur=AREAS.find(a=>a.id===state.area), reg=REGIONS.find(r=>r.id===cur.r);
  document.getElementById("regionName").textContent=reg.name;
  document.getElementById("regionSub").textContent="Over the Hill · "+reg.country;
  const rg=document.getElementById("regions"); rg.innerHTML="";
  for (const r of REGIONS){
    const tr=AREAS.filter(a=>a.r===r.id).flatMap(a=>trackables(a.id)), d=tr.filter(isDone).length;
    const b=document.createElement("button"); b.className="region"; b.setAttribute("aria-pressed", r.id===cur.r);
    b.innerHTML=`${r.country}<span>${d}/${tr.length}</span>`;
    b.onclick=()=>{ if(r.id!==cur.r) switchArea(LS.get("last:"+r.id, AREAS.find(a=>a.r===r.id).id)); };
    rg.appendChild(b);
  }
  const t=document.getElementById("tabs"); t.innerHTML="";
  const list=AREAS.filter(a=>a.r===cur.r); t.style.setProperty("--n", list.length);
  for (const a of list){
    const tr=trackables(a.id), d=tr.filter(isDone).length;
    const b=document.createElement("button"); b.className="tab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", a.id===state.area);
    b.innerHTML=`<b>${a.name}</b><span>${d}/${tr.length}</span>`;
    b.onclick=()=>switchArea(a.id); t.appendChild(b);
  }
  const tr=trackables(state.area), d=tr.filter(isDone).length;
  document.getElementById("progNum").textContent = `${d} / ${tr.length}`;
  document.getElementById("progBar").style.width = (tr.length? d/tr.length*100:0)+"%";
  document.getElementById("progLbl").textContent = AREAS.find(a=>a.id===state.area).name + " collectibles";
}
function itemBtn(m){
  const b=document.createElement("button"); b.className="item"+(isDone(m)?" done":"");
  b.innerHTML=`<span class="cbx" role="checkbox" aria-checked="${isDone(m)}" tabindex="-1">${CHECK}</span><span class="nm"></span>${m.d?`<span class="diff ${m.d}">${m.d[0].toUpperCase()}</span>`:""}<span class="gr">${m.g}</span>`;
  b.querySelector(".nm").textContent=m.n;
  b.querySelector(".cbx").addEventListener("click", e=>{ e.stopPropagation(); toggleCollected(colKey(m)); });
  b.onclick=()=>{ if(keyOff(m)){ unhide(m); } flyTo(m); select(m.id); if (matchMedia("(max-width:760px)").matches) document.getElementById("app").classList.remove("side-open"); };
  return b;
}
function unhide(m){ if(m.c==="animal"){ state.off.delete("animals"); state.off.delete("sp:"+m.s);} else state.off.delete(m.c); LS.set("off",[...state.off]); }
function row(key, label, chipHtml, ms, offKey, spKey){
  const total=ms.length, done=ms.filter(isDone).length;
  const r=document.createElement("div"); r.className="row"+(state.off.has(offKey)?" off":"")+(state.open.has(key)?" open":"");
  r.innerHTML=`<div class="row-line"><button class="eye" aria-label="Show or hide ${label}" aria-pressed="${!state.off.has(offKey)}">${chipHtml}</button>
    ${spKey?`<button class="seen${state.collected.has(spKey)?" on":""}" role="checkbox" aria-checked="${state.collected.has(spKey)}" aria-label="Seen ${label}"><span class="cbx${state.collected.has(spKey)?" on":""}">${CHECK}</span></button>`:""}
    <button class="row-main" aria-expanded="${state.open.has(key)}"><span class="lbl"></span><span class="cnt${spKey?(state.collected.has(spKey)?" full":""):(done===total&&total?" full":"")}">${spKey?(state.collected.has(spKey)?"seen":`${total} spot${total>1?"s":""}`):`${done}/${total}`}<i class="caret"></i></span></button></div><div class="items"></div>`;
  if (spKey) r.querySelector(".seen").onclick=()=>toggleCollected(spKey);
  r.querySelector(".lbl").textContent=label;
  r.querySelector(".eye").onclick=()=>{ state.off.has(offKey)?state.off.delete(offKey):state.off.add(offKey); LS.set("off",[...state.off]); renderAll(); };
  r.querySelector(".row-main").onclick=()=>{ state.open.has(key)?state.open.delete(key):state.open.add(key); LS.set("open",[...state.open]); renderSide(); };
  if (state.open.has(key)){
    const box=r.querySelector(".items");
    const sorted=[...ms].sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true}));
    for (const m of sorted) if (!state.q || visibleIgnoringToggles(m)) box.appendChild(itemBtn(m));
  }
  return r;
}
function visibleIgnoringToggles(m){ const q=state.q.toLowerCase(); return m.n.toLowerCase().includes(q)||catOf(m).one.toLowerCase().includes(q)||(m.g||"").toLowerCase()===q; }
function groupLabel(text, keys){
  const g=document.createElement("div"); g.className="group-label";
  const allOn = keys.every(k=>!state.off.has(k));
  g.innerHTML=`<span></span><button>${allOn?"Hide all":"Show all"}</button>`;
  g.firstChild.textContent=text;
  g.querySelector("button").onclick=()=>{ keys.forEach(k=>allOn?state.off.add(k):state.off.delete(k)); LS.set("off",[...state.off]); renderAll(); };
  return g;
}
function renderSide(){
  const box=document.getElementById("cats"); const st=box.scrollTop; box.innerHTML="";
  const ms=MARKERS[state.area];
  const groups=[["Collectibles",CATS.filter(c=>c.track)],["Other markers",CATS.filter(c=>!c.track)]];
  for (const [label,cs] of groups){
    const present=cs.filter(c=>ms.some(m=>m.c===c.k));
    box.appendChild(groupLabel(label, present.map(c=>c.k)));
    for (const c of present){
      box.appendChild(row(c.k, c.label, `<span class="chip" style="background:${c.color}"><img src="${ICONS[c.k]}" alt=""></span>`, ms.filter(m=>m.c===c.k), c.k));
    }
  }
  const sp=[...new Set(ms.filter(m=>m.c==="animal").map(m=>m.s))].sort();
  const seenN=sp.filter(s=>state.collected.has(`sp:${state.area}:${s}`)).length;
  const g=groupLabel(`Animals seen ${seenN}/${sp.length}`, ["animals"]); box.appendChild(g);
  for (const s of sp){
    const r=row("sp:"+s, s, `<span class="dot" style="background:${SPC[s]}"></span>`, ms.filter(m=>m.c==="animal"&&m.s===s), "sp:"+s, `sp:${state.area}:${s}`);
    if (state.off.has("animals")) r.classList.add("off");
    r.querySelector(".eye").onclick=()=>{ if(state.off.has("animals")){ state.off.delete("animals"); sp.forEach(x=>{ if(x!==s) state.off.add("sp:"+x); }); state.off.delete("sp:"+s);} else { state.off.has("sp:"+s)?state.off.delete("sp:"+s):state.off.add("sp:"+s);} LS.set("off",[...state.off]); renderAll(); };
    box.appendChild(r);
  }
  box.scrollTop=st;
}
function renderAll(){ renderTabs(); renderSide(); paintMarkers(); if(popEl&&state.sel) select(state.sel); }
function switchArea(a){
  if (a===state.area) return;
  state.area=a; LS.set("area",a); LS.set("last:"+AREAS.find(x=>x.id===a).r, a); state.sel=null; if(popEl){popEl.remove();popEl=null;}
  img.src="map_"+a+".jpg"; buildMarkers(); renderAll();
}
document.getElementById("search").addEventListener("input", e=>{ state.q=e.target.value.trim(); renderSide(); paintMarkers(); });
const hd=document.getElementById("hideDone"); hd.checked=state.hideDone; hd.onchange=()=>{ state.hideDone=hd.checked; LS.set("hideDone",hd.checked); paintMarkers(); };
document.getElementById("openSide").onclick=()=>document.getElementById("app").classList.add("side-open");
document.getElementById("closeSide").onclick=()=>document.getElementById("app").classList.remove("side-open");
function renderReset(){
  const w=document.getElementById("resetWrap"); w.innerHTML='<button class="btn danger" id="resetBtn">Reset map</button>';
  w.firstChild.onclick=()=>{
    const name=AREAS.find(a=>a.id===state.area).name;
    w.innerHTML=`<span class="confirm">Clear ${name}? <button class="btn danger" id="yes">Clear</button><button class="btn" id="no">Keep</button></span>`;
    w.querySelector("#yes").onclick=()=>{ for(const m of MARKERS[state.area]) state.collected.delete(colKey(m)); queueSave(); renderAll(); renderReset(); };
    w.querySelector("#no").onclick=renderReset;
  };
}
renderReset();
const bk=document.getElementById("backup"), bkText=document.getElementById("backupText"), bkMsg=document.getElementById("bkMsg");
document.getElementById("bkToggle").onclick=()=>{ bk.hidden=!bk.hidden; if(!bk.hidden){ bkText.value=JSON.stringify({v:1,ids:[...state.collected]}); bkMsg.textContent=""; } };
document.getElementById("bkCopy").onclick=()=>{ bkText.value=JSON.stringify({v:1,ids:[...state.collected]}); navigator.clipboard?.writeText(bkText.value).then(()=>bkMsg.textContent="Copied",()=>{bkText.select();bkMsg.textContent="Selected, press Ctrl+C";}) ?? (bkText.select(), bkMsg.textContent="Selected, press Ctrl+C"); };
document.getElementById("bkRestore").onclick=()=>{
  try{ const o=JSON.parse(bkText.value); const ids=[...normalize((o.ids||o).filter(validKey))]; if(!ids.length) throw 0;
    ids.forEach(id=>state.collected.add(id)); queueSave(); renderAll(); bkMsg.textContent=`Restored ${ids.length} items`; }
  catch{ bkMsg.textContent="That code isn't valid. Copy the whole code and try again."; }
};

/* ---------- boot ---------- */
img.src="map_"+state.area+".jpg";
buildMarkers(); renderAll(); setSaveLabel();
requestAnimationFrame(fit);
initStore();
</script>
</body></html>
